[project]
name = "syncmill"
version = "0.1.0"
description = "Multi-agent orchestration with shared memory — grind tasks through competing and collaborating AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "memtomem[onnx,korean]>=0.2.4",
    "mcp>=1.26.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "click>=8.1",
    "textual>=8.2.8",
    "tomlkit>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
syncmill = "syncmill.cli:cli"

[dependency-groups]
dev = ["pytest>=8.0", "jsonschema>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
