[project]
name = "syncmill"
version = "0.2.0"
description = "Multi-agent orchestration with shared memory — grind tasks through competing and collaborating AI agents"
authors = [{name = "DAPADA Inc. and syncmill contributors", email = "contact@dapada.co.kr"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["ai", "agent", "orchestration", "memory", "cli", "multi-agent", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "memtomem[onnx,korean]>=0.4.0,<0.5",
    "mcp>=2.0.0,<3",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "click>=8.1",
    "textual>=8.2.8",
    "tomlkit>=0.15.0",
]

[project.optional-dependencies]
mem0 = [
    # Before changing this range, install the extra and run the required real smoke:
    # uv sync --extra mem0
    # SYNCMILL_TEST_MEM0_REAL=1 uv run pytest -q tests/test_memory_backend_mem0_integration.py
    "mem0ai>=2.0.11,<2.1",
    "fastembed>=0.8,<0.9",
]
langgraph = [
    # Before changing this range, install the extra and run the required real smoke:
    # uv sync --extra langgraph
    # SYNCMILL_TEST_LANGGRAPH_REAL=1 uv run pytest -q tests/test_memory_backend_langgraph_integration.py
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "fastembed>=0.8,<0.9",
]
phoenix = [
    # Before changing this range, install the extra and run the required real smoke:
    # uv sync --extra phoenix
    # SYNCMILL_TEST_PHOENIX_REAL=1 uv run pytest -q tests/test_phoenix_exporter_integration.py
    "arize-phoenix-otel>=0.16.1,<0.17",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project.scripts]
syncmill = "syncmill.cli:cli"

[project.urls]
Homepage = "https://github.com/memtomem/syncmill"
Repository = "https://github.com/memtomem/syncmill"
Issues = "https://github.com/memtomem/syncmill/issues"
Changelog = "https://github.com/memtomem/syncmill/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jsonschema>=4",
    "ruff>=0.15.22",
    # The documentation link guard walks a real CommonMark token stream rather
    # than pattern-matching Markdown by hand — hand-rolled fence/inline-code
    # scanners kept hiding broken links (list-contained fences, backtick info
    # strings, escaped backticks, reference-style links). Declared explicitly,
    # not leaned on as a transitive of textual's rich.
    "markdown-it-py>=3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: opt-in tests that exercise optional real backends",
]
